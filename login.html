<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Login | R&G Forge 3D</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/gestao.css"><style>body.login-page{min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f5f5f5;padding:24px}.login-card{width:min(430px,100%);padding:32px;background:#171719;border:1px solid #38383d;border-radius:18px;box-shadow:0 18px 60px #0008}.login-card img{display:block;width:140px;max-height:100px;object-fit:contain;margin:0 auto 18px}.login-card h1{text-align:center;font-size:1.5rem}.login-card p{text-align:center;color:#aaa}.login-card label{display:block;margin:18px 0 6px}.login-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #444;border-radius:8px;background:#0f0f11;color:#fff}.login-card button{width:100%;margin-top:22px;padding:13px;background:#ff710a;color:#111;border:0;border-radius:8px;font-weight:800;cursor:pointer}.login-error{margin-top:14px;color:#ff9d7c}.login-note{font-size:.8rem;color:#888!important}</style></head><body class="login-page"><main class="login-card"><img src="assets/images/logo.png" alt="R&G Forge 3D"><h1>Acesso administrativo</h1><p>Entre para acessar o sistema de gestão.</p><form id="loginForm"><label for="username">Usuário</label><input id="username" autocomplete="username" required value="ray"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button><p id="loginError" class="login-error" hidden></p></form><p class="login-note">A conta deve ser criada previamente no Supabase Auth.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/auth.js"></script></body></html>
